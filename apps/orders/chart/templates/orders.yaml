{{- $name := include "orders.componentName" (dict "root" $ "component" "api") }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "orders.labels" (dict "root" $ "component" "api") | nindent 4 }}
spec:
  replicas: {{ .Values.orders.replicaCount }}
  selector:
    matchLabels:
      {{- include "orders.selectorLabels" (dict "root" $ "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "orders.selectorLabels" (dict "root" $ "component" "api") | nindent 8 }}
    spec:
      containers:
        - name: orders
          image: "{{ .Values.orders.image.repository }}:{{ required "orders.image.tag is required (set it in envs/<env>.yaml)" .Values.orders.image.tag }}"
          imagePullPolicy: {{ .Values.orders.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          env:
            {{- include "orders.backendEnv" . | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          # /ready checks Postgres AND Redis. An orders pod that cannot publish
          # would accept orders inventory never hears about, so it should leave
          # the Service rather than take traffic.
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.orders.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "orders.labels" (dict "root" $ "component" "api") | nindent 4 }}
spec:
  # ClusterIP: reachable only from inside the cluster, and in practice only
  # through the gateway. Nothing in the Ingress points here.
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.orders.service.port }}
      targetPort: http
  selector:
    {{- include "orders.selectorLabels" (dict "root" $ "component" "api") | nindent 4 }}
