{{- $name := include "orders.componentName" (dict "root" $ "component" "gateway") }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "orders.labels" (dict "root" $ "component" "gateway") | nindent 4 }}
spec:
  replicas: {{ .Values.gateway.replicaCount }}
  selector:
    matchLabels:
      {{- include "orders.selectorLabels" (dict "root" $ "component" "gateway") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "orders.selectorLabels" (dict "root" $ "component" "gateway") | nindent 8 }}
    spec:
      containers:
        - name: gateway
          image: "{{ .Values.gateway.image.repository }}:{{ required "gateway.image.tag is required (set it in envs/<env>.yaml)" .Values.gateway.image.tag }}"
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          env:
            # Kubernetes Service DNS. The same image gets compose service names
            # locally -- it holds no knowledge of either environment.
            - name: ORDERS_URL
              value: "http://{{ include "orders.componentName" (dict "root" $ "component" "api") }}:{{ .Values.orders.service.port }}"
            - name: INVENTORY_URL
              value: "http://{{ include "orders.componentName" (dict "root" $ "component" "inventory") }}:{{ .Values.inventory.service.port }}"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          # /ready reports unavailable when an upstream is down, so a gateway
          # that can serve nothing stops receiving traffic.
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "orders.labels" (dict "root" $ "component" "gateway") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.gateway.service.port }}
      targetPort: http
  selector:
    {{- include "orders.selectorLabels" (dict "root" $ "component" "gateway") | nindent 4 }}
