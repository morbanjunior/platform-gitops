{{- if .Values.database.passwordSecret.encrypted }}
# See apps/tasks/chart/templates/sealed-secret.yaml for the reasoning. Same
# pattern, same guarantees: the ciphertext is bound to this namespace and this
# name, and only the in-cluster controller can decrypt it.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ .Values.database.passwordSecret.name }}
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "orders.labels" (dict "root" $ "component" "database") | nindent 4 }}
spec:
  encryptedData:
    {{ .Values.database.passwordSecret.key }}: {{ .Values.database.passwordSecret.encrypted | quote }}
  template:
    metadata:
      name: {{ .Values.database.passwordSecret.name }}
      namespace: {{ .Values.namespace.name }}
      labels:
        {{- include "orders.labels" (dict "root" $ "component" "database") | nindent 8 }}
    type: Opaque
{{- end }}
