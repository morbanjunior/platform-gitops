{{- $name := include "orders.componentName" (dict "root" $ "component" "inventory") }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "orders.labels" (dict "root" $ "component" "inventory") | nindent 4 }}
spec:
  # Scaling this out is safe: every replica joins the same Redis consumer group,
  # so Redis hands each event to exactly one of them. They share the work rather
  # than each applying the same deduction.
  replicas: {{ .Values.inventory.replicaCount }}
  selector:
    matchLabels:
      {{- include "orders.selectorLabels" (dict "root" $ "component" "inventory") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "orders.selectorLabels" (dict "root" $ "component" "inventory") | nindent 8 }}
    spec:
      containers:
        - name: inventory
          image: "{{ .Values.inventory.image.repository }}:{{ required "inventory.image.tag is required (set it in envs/<env>.yaml)" .Values.inventory.image.tag }}"
          imagePullPolicy: {{ .Values.inventory.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          env:
            {{- include "orders.backendEnv" . | nindent 12 }}
            # The consumer name must be unique per replica or two pods would
            # claim the same identity inside the group. The pod name already
            # is unique, so the downward API supplies it for free.
            - name: CONSUMER_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.inventory.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "orders.labels" (dict "root" $ "component" "inventory") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.inventory.service.port }}
      targetPort: http
  selector:
    {{- include "orders.selectorLabels" (dict "root" $ "component" "inventory") | nindent 4 }}
