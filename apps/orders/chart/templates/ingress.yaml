{{- if .Values.ingress.enabled }}
# One rule, one backend.
#
# Unlike the tasks chart, this Ingress does no path routing: everything goes to
# the gateway, and the gateway decides. Splitting the routing between the
# Ingress and a gateway would mean two places to look when a request lands
# somewhere unexpected.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "orders.fullname" . }}
  labels:
    {{- include "orders.labels" (dict "root" $ "component" "ingress") | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ required "ingress.host is required (set it in envs/<env>.yaml)" .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "orders.componentName" (dict "root" $ "component" "gateway") }}
                port:
                  number: {{ .Values.gateway.service.port }}
{{- end }}
