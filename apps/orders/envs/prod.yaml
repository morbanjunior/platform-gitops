# PRODUCTION
#
# Only ever changed by merging a promotion pull request, reviewed by a CODEOWNER.
# A commit here is a deployment to production: it is the audit record of who
# approved which version and when.
#
# Rollback is `git revert` of that commit.

environment: prod

namespace:
  name: orders-prod

database:
  name: appdb_prod
  passwordSecret:
    # Encrypted for the orders-prod namespace with the cluster's public key.
    #
    # The ciphertext is bound to that namespace AND to the Secret name, so it
    # cannot be copied from staging even though it protects the same database
    # user -- that binding is exactly what stops a development password from
    # being replayed into production. Reseal with:
    #
    #   python scripts\secrets.py rotate orders prod
    encrypted: ""

ingress:
  # No prefix: production owns the bare hostname.
  host: orders.local

components:
  gateway:
    image:
      tag: v1.0.0
    # Two replicas, not one: a single replica means a rolling update, a node
    # drain or one crash is an outage. Two is the smallest number that survives
    # losing one -- and the gateway is the only way in, so it is the one
    # component whose absence takes the whole application down.
    replicaCount: 2
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {cpu: 500m, memory: 256Mi}

  api:
    image:
      tag: v1.0.0
    replicaCount: 2
    resources:
      requests: {cpu: 100m, memory: 192Mi}
      limits: {cpu: 500m, memory: 384Mi}

  inventory:
    image:
      tag: v1.0.0
    # Two consumers, the arrangement staging already proved correct: Redis hands
    # each event to exactly one member of the group, so the totals come out the
    # same as with one replica. Production is not the place to find out.
    replicaCount: 2
    resources:
      requests: {cpu: 100m, memory: 192Mi}
      limits: {cpu: 500m, memory: 384Mi}

redis:
  # More room than staging: this volume holds the events still in flight, and
  # filling it means dropping them.
  storage: 5Gi
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 384Mi}
