apiVersion: v1
kind: Service
metadata:
  name: {{ include "tasks.componentName" (dict "root" $ "component" "frontend") }}
  labels:
    {{- include "tasks.labels" (dict "root" $ "component" "frontend") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: http
  selector:
    {{- include "tasks.selectorLabels" (dict "root" $ "component" "frontend") | nindent 4 }}
