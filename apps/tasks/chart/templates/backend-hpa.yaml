{{- if .Values.backend.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "tasks.componentName" (dict "root" $ "component" "backend") }}
  labels:
    {{- include "tasks.labels" (dict "root" $ "component" "backend") | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "tasks.componentName" (dict "root" $ "component" "backend") }}
  minReplicas: {{ .Values.backend.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.backend.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          # Percentage of resources.requests.cpu, not of node capacity. Without
          # a CPU request the HPA has no baseline and reports <unknown>.
          averageUtilization: {{ .Values.backend.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}

# Disabled in dev on purpose: autoscaling there only burns laptop resources and
# hides how the application behaves on a single replica.
#
# Only the backend scales. The frontend serves static files, is I/O bound and
# costs almost no CPU -- an HPA there would be autoscaling theatre.
