apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tasks-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/morbanjunior/platform-gitops.git
    targetRevision: main
    path: apps/tasks/chart
    helm:
      # Layered: chart defaults first, environment overrides on top. Paths are
      # relative to the chart directory and stay inside the repository.
      valueFiles:
        - values.yaml
        - ../envs/dev.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: tasks-dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
