apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tasks-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/morbanjunior/platform-gitops.git
    targetRevision: main
    path: apps/tasks/chart
    helm:
      valueFiles:
        - values.yaml
        - ../envs/prod.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: tasks-prod

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
