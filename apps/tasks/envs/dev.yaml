# DEV
#
# Updated automatically by the api-backend pipeline on every published release.
# Do not edit the image tags by hand.
#
# Purpose: catch integration problems early. Everything is minimal here --
# one replica, no autoscaling, smallest resources -- because dev exists to
# answer "does it start and talk to its dependencies?", not "does it scale?".

environment: dev
namespace:
  name: tasks-dev
database:
  name: appdb_dev
  passwordSecret:
    # Encrypted for this namespace with the cluster's public key. Only the
    # sealed-secrets controller can decrypt it, so this is safe in a public
    # repository. Reseal with kubeseal to change it -- see RUNBOOK.
    encrypted: 
ingress:
  host: dev.tasks.local
backend:
  image:
    tag: v1.0.4
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 300m
      memory: 192Mi
  autoscaling:
    # Off in dev: a single replica makes logs and debugging straightforward,
    # and autoscaling on a laptop only burns resources.
    enabled: false
frontend:
  image:
    tag: v1.0.4
  replicaCount: 1
  resources:
    requests:
      cpu: 10m
      memory: 24Mi
    limits:
      cpu: 50m
      memory: 48Mi
