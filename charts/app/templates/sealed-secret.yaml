{{- if .Values.database.passwordSecret.encrypted }}
# The database password, encrypted with the cluster's public key.
#
# Safe to commit to a public repository: only the sealed-secrets controller
# holds the private key, and it never leaves the cluster. Note the contrast
# with a plain Secret, whose `data` is base64 -- encoding, not encryption.
#
# The controller decrypts this and creates a normal Secret with the same name,
# so the Deployments' secretKeyRef never had to change.
#
# The ciphertext is bound to this namespace AND this name. Moving the blob to
# another namespace makes the controller refuse it, which is what stops a
# development value from being replayed into production.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ .Values.database.passwordSecret.name }}
  namespace: {{ .Values.namespace.name }}
  # Wave -1: before any workload. The controller needs a moment to decrypt this
  # into a real Secret, and a pod scheduled first would crash-loop on a
  # secretKeyRef that does not exist yet.
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    {{- include "app.labels" (dict "root" $ "component" "database") | nindent 4 }}
spec:
  encryptedData:
    {{ .Values.database.passwordSecret.key }}: {{ .Values.database.passwordSecret.encrypted | quote }}
  # Metadata for the Secret the controller will create.
  template:
    metadata:
      name: {{ .Values.database.passwordSecret.name }}
      namespace: {{ .Values.namespace.name }}
      labels:
        {{- include "app.labels" (dict "root" $ "component" "database") | nindent 8 }}
    type: Opaque
{{- end }}
