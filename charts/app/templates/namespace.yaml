{{- if .Values.namespace.create }}
# The namespace is a versioned resource like any other, so it can carry labels,
# quotas or network policies that are reviewable in a pull request.
#
# Wave -2: the first thing to exist. Everything else in this chart lives inside
# it, and on a rebuilt cluster there is nothing to place them in yet.
apiVersion: v1
kind: Namespace
metadata:
  name: {{ required "namespace.name is required (set it in envs/<env>.yaml)" .Values.namespace.name }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    {{- include "app.labels" (dict "root" $ "component" "namespace") | nindent 4 }}
{{- end }}
