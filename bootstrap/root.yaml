# The only manifest in this repository that ever needs kubectl.
#
#   kubectl apply -f bootstrap/root.yaml
#
# Applied once per cluster. From then on, onboarding an application means
# adding apps/<name>/ with a values file per environment and pushing; retiring
# one means deleting that folder. The cluster holds no information that is not
# in Git, so rebuilding it is an ArgoCD install plus this single command.
#
# It lives OUTSIDE apps/ deliberately, so it does not manage itself: a bad
# commit could otherwise leave the root unable to repair itself.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/morbanjunior/platform-gitops.git
    targetRevision: main
    # platform/ holds the AppProjects and the ApplicationSet that generates
    # every Application. It needs no include filter: everything under it is a
    # valid standalone manifest, unlike apps/ and charts/, which hold Helm
    # templates and values files ArgoCD must never try to apply directly.
    path: platform
    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc
    # Application objects only take effect where ArgoCD watches for them.
    namespace: argocd

  syncPolicy:
    automated:
      # Deleting an Application file removes that Application, and its own
      # finalizer then removes everything it had deployed.
      prune: true
      selfHeal: true
