# The only manifest in this repository that ever needs kubectl.
#
#   kubectl apply -f bootstrap/root.yaml
#
# Applied once per cluster. From then on, onboarding an application means
# adding apps/<name>/ with its Application manifests and pushing; retiring one
# means deleting that folder. The cluster holds no information that is not in
# Git, so rebuilding it is an ArgoCD install plus this single command.
#
# It lives OUTSIDE apps/ deliberately, so it does not manage itself: a bad
# commit could otherwise leave the root unable to repair itself.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/morbanjunior/platform-gitops.git
    targetRevision: main
    path: apps
    directory:
      recurse: true
      # The important part. apps/ contains Helm charts and values files that
      # are NOT valid standalone manifests -- without this filter ArgoCD would
      # try to apply raw Go templates to the cluster and fail.
      #
      # Only files under apps/<name>/applications/ are applied.
      include: '*/applications/*.yaml'

  destination:
    server: https://kubernetes.default.svc
    # Application objects only take effect where ArgoCD watches for them.
    namespace: argocd

  syncPolicy:
    automated:
      # Deleting an Application file removes that Application, and its own
      # finalizer then removes everything it had deployed.
      prune: true
      selfHeal: true
